server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

spring:
  application:
    name: cart-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ecommerce-platform-project

  datasource:
    driver-class-name: ${CART_SERVICE_DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
    url: jdbc:${CART_SERVICE_DB_DRIVER:postgresql}://${CART_SERVICE_DB_HOST:localhost}:${CART_SERVICE_DB_PORT:5436}/${CART_SERVICE_DB_NAME:cart-service-db}
    username: ${CART_SERVICE_DB_USERNAME:username}
    password: ${CART_SERVICE_DB_PASSWORD:password}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}

  jpa:
    open-in-view: false
    show-sql: true

    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  liquibase:
    enabled: false
    change-log: classpath:/db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
    consumer:
      group-id: cart-service
      properties:
        spring.json.trusted.packages: ru.ivanov.ecommerceplatformproject.sharedlibs.event

management:
  server:
    port: 8080